<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hill Climb Racing</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
    }

    * {
      box-sizing: border-box;
    }

    html, body, #app-container {
      height: 100%;
      width: 100%;
    }

    #app-container {
      position: relative;
      overflow: auto;
    }

    /* Garage Screen */
    #garage-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%);
    }

    #garage-screen.hidden {
      display: none;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #333;
      border-radius: 15px;
      padding: 15px 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .coin-icon, .diamond-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 3px solid #333;
    }

    .coin-icon {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    }

    .diamond-icon {
      background: linear-gradient(135deg, #00CED1 0%, #1E90FF 100%);
    }

    .garage-title {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      text-shadow: 4px 4px 0 #333, -2px -2px 0 #333, 2px -2px 0 #333, -2px 2px 0 #333;
      margin-bottom: 20px;
    }

    .upgrade-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .upgrade-card {
      background: rgba(255, 255, 255, 0.95);
      border: 5px solid #333;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .upgrade-card:hover {
      transform: translateY(-5px);
    }

    .upgrade-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      border-radius: 15px;
      border: 4px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .upgrade-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .upgrade-level {
      text-align: center;
      font-size: 18px;
      color: #666;
    }

    .progress-bar {
      width: 100%;
      height: 25px;
      background: #ddd;
      border: 3px solid #333;
      border-radius: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
      transition: width 0.3s;
    }

    .upgrade-button {
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: 4px solid #333;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .upgrade-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    .upgrade-button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .race-button {
      padding: 25px 60px;
      font-size: 36px;
      font-weight: bold;
      border: 6px solid #333;
      border-radius: 25px;
      cursor: pointer;
      background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
      color: white;
      text-shadow: 3px 3px 0 #333;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      transition: all 0.3s;
      align-self: flex-end;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .race-button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
    }

    /* Game Screen */
    #game-screen {
      display: none;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #game-screen.active {
      display: block;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .game-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .game-stat {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 240, 240, 0.95) 100%);
      border: 4px solid #333;
      border-radius: 20px;
      padding: 15px 30px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .fuel-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      background: linear-gradient(135deg, rgba(40, 40, 40, 0.95) 0%, rgba(20, 20, 20, 0.95) 100%);
      border: 5px solid #FFD700;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 2px 10px rgba(255,215,0,0.3);
    }

    .fuel-label {
      font-size: 22px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255,215,0,0.6), 2px 2px 4px rgba(0,0,0,0.8);
      text-align: center;
      letter-spacing: 3px;
    }

    .fuel-progress {
      width: 100%;
      height: 30px;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 4px solid #FFD700;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
    }

    .fuel-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF2200 0%, #FF6600 30%, #FFAA00 60%, #00FF00 100%);
      transition: width 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.8), inset 0 2px 5px rgba(255,255,255,0.4);
      animation: fuel-glow 2s infinite;
    }

    @keyframes fuel-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.8), inset 0 2px 5px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 30px rgba(0, 255, 0, 1), inset 0 2px 5px rgba(255,255,255,0.6); }
    }

    .game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 30px;
    }

    .game-over-screen.visible {
      display: flex;
    }

    .game-over-title {
      font-size: 64px;
      font-weight: bold;
      color: #fff;
      text-shadow: 4px 4px 0 #333;
    }

    .game-over-stats {
      background: rgba(255, 255, 255, 0.95);
      border: 5px solid #333;
      border-radius: 20px;
      padding: 30px 50px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-over-stat {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-between;
      gap: 40px;
    }

    .back-button {
      padding: 20px 50px;
      font-size: 28px;
      font-weight: bold;
      border: 5px solid #333;
      border-radius: 20px;
      cursor: pointer;
      background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
      color: white;
      text-shadow: 2px 2px 0 #333;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }

    .back-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Garage Screen -->
    <div id="garage-screen">
      <div class="hud-bar">
        <div class="hud-item">
          <div class="coin-icon">🪙</div>
          <span id="coin-count">0</span>
        </div>
        <div class="hud-item">
          <div class="diamond-icon">💎</div>
          <span id="diamond-count">0</span>
        </div>
      </div>

      <div class="garage-title" id="garage-title">GARAGE</div>

      <div class="upgrade-container">
        <div class="upgrade-card">
          <div class="upgrade-icon" style="background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);">🏎️</div>
          <div class="upgrade-title">ENGINE</div>
          <div class="upgrade-level" id="engine-level">Level 1</div>
          <div class="progress-bar">
            <div class="progress-fill" id="engine-progress" style="width: 10%"></div>
          </div>
          <button class="upgrade-button" id="engine-upgrade" data-upgrade="engine">
            Upgrade (100 🪙)
          </button>
        </div>

        <div class="upgrade-card">
          <div class="upgrade-icon" style="background: linear-gradient(135deg, #6BCB77 0%, #4D96A9 100%);">🔧</div>
          <div class="upgrade-title">SUSPENSION</div>
          <div class="upgrade-level" id="suspension-level">Level 1</div>
          <div class="progress-bar">
            <div class="progress-fill" id="suspension-progress" style="width: 10%"></div>
          </div>
          <button class="upgrade-button" id="suspension-upgrade" data-upgrade="suspension">
            Upgrade (100 🪙)
          </button>
        </div>

        <div class="upgrade-card">
          <div class="upgrade-icon" style="background: linear-gradient(135deg, #4E4FEB 0%, #7B68EE 100%);">🛞</div>
          <div class="upgrade-title">TIRES</div>
          <div class="upgrade-level" id="tires-level">Level 1</div>
          <div class="progress-bar">
            <div class="progress-fill" id="tires-progress" style="width: 10%"></div>
          </div>
          <button class="upgrade-button" id="tires-upgrade" data-upgrade="tires">
            Upgrade (100 🪙)
          </button>
        </div>

        <div class="upgrade-card">
          <div class="upgrade-icon" style="background: linear-gradient(135deg, #FFB800 0%, #FF6B6B 100%);">⚙️</div>
          <div class="upgrade-title">4WD</div>
          <div class="upgrade-level" id="four-wd-level">Level 1</div>
          <div class="progress-bar">
            <div class="progress-fill" id="four-wd-progress" style="width: 10%"></div>
          </div>
          <button class="upgrade-button" id="four-wd-upgrade" data-upgrade="four_wd">
            Upgrade (100 🪙)
          </button>
        </div>
      </div>

      <button class="race-button" id="race-button">RACE!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
      <canvas id="game-canvas"></canvas>
      
      <div class="game-hud">
        <div class="game-stat">
          Distance: <span id="distance-stat">0</span>m
        </div>
        <div class="game-stat">
          🪙 <span id="coins-stat">0</span>
        </div>
      </div>

      <div class="fuel-bar">
        <div class="fuel-label">⛽ FUEL ⛽</div>
        <div class="fuel-progress">
          <div class="fuel-fill" id="fuel-fill" style="width: 100%"></div>
        </div>
      </div>

      <div class="game-over-screen" id="game-over-screen">
        <div class="game-over-title">GAME OVER!</div>
        <div class="game-over-stats">
          <div class="game-over-stat">
            <span>Distance:</span>
            <span id="final-distance">0m</span>
          </div>
          <div class="game-over-stat">
            <span>Coins Earned:</span>
            <span id="final-coins">0</span>
          </div>
          <div class="game-over-stat">
            <span>High Score:</span>
            <span id="high-score">0m</span>
          </div>
        </div>
        <button class="back-button" id="back-button">BACK TO GARAGE</button>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = {
      game_title: "GARAGE",
      race_button_text: "RACE!",
      background_color: "#87CEEB",
      surface_color: "#FFFFFF",
      text_color: "#333333",
      primary_action_color: "#FF6B35",
      secondary_action_color: "#FFD700"
    };

    let config = { ...defaultConfig };
    let gameData = null;

    async function onConfigChange(newConfig) {
      const garageTitle = document.getElementById('garage-title');
      const raceButton = document.getElementById('race-button');

      if (garageTitle) {
        garageTitle.textContent = newConfig.game_title || defaultConfig.game_title;
      }
      if (raceButton) {
        raceButton.textContent = newConfig.race_button_text || defaultConfig.race_button_text;
      }

      const appContainer = document.getElementById('app-container');
      if (appContainer) {
        appContainer.style.background = `linear-gradient(to bottom, ${newConfig.background_color || defaultConfig.background_color} 0%, #90EE90 100%)`;
      }

      document.querySelectorAll('.hud-bar, .game-stat, .fuel-bar, .upgrade-card, .game-over-stats').forEach(el => {
        el.style.background = `rgba(255, 255, 255, 0.95)`;
      });

      document.querySelectorAll('.hud-item, .upgrade-title, .game-over-stat').forEach(el => {
        el.style.color = newConfig.text_color || defaultConfig.text_color;
      });

      const raceBtn = document.getElementById('race-button');
      if (raceBtn) {
        raceBtn.style.background = `linear-gradient(135deg, ${newConfig.primary_action_color || defaultConfig.primary_action_color} 0%, #FF8C42 100%)`;
      }

      document.querySelectorAll('.upgrade-button').forEach(btn => {
        if (!btn.disabled) {
          btn.style.background = `linear-gradient(135deg, ${newConfig.secondary_action_color || defaultConfig.secondary_action_color} 0%, #FFA500 100%)`;
        }
      });
    }

    const capabilities = {
      recolorables: [
        {
          get: () => config.background_color || defaultConfig.background_color,
          set: (value) => {
            config.background_color = value;
            window.elementSdk.setConfig({ background_color: value });
          }
        },
        {
          get: () => config.surface_color || defaultConfig.surface_color,
          set: (value) => {
            config.surface_color = value;
            window.elementSdk.setConfig({ surface_color: value });
          }
        },
        {
          get: () => config.text_color || defaultConfig.text_color,
          set: (value) => {
            config.text_color = value;
            window.elementSdk.setConfig({ text_color: value });
          }
        },
        {
          get: () => config.primary_action_color || defaultConfig.primary_action_color,
          set: (value) => {
            config.primary_action_color = value;
            window.elementSdk.setConfig({ primary_action_color: value });
          }
        },
        {
          get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
          set: (value) => {
            config.secondary_action_color = value;
            window.elementSdk.setConfig({ secondary_action_color: value });
          }
        }
      ],
      borderables: [],
      fontEditable: undefined,
      fontSizeable: undefined
    };

    function mapToEditPanelValues(config) {
      return new Map([
        ["game_title", config.game_title || defaultConfig.game_title],
        ["race_button_text", config.race_button_text || defaultConfig.race_button_text]
      ]);
    }

    const dataHandler = {
      onDataChanged(data) {
        if (data.length > 0) {
          gameData = data[0];
          updateGarageUI();
        }
      }
    };

    async function initGame() {
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: () => capabilities,
          mapToEditPanelValues
        });
        config = window.elementSdk.config;
        await onConfigChange(config);
      }

      if (window.dataSdk) {
        const initResult = await window.dataSdk.init(dataHandler);
        if (!initResult.isOk) {
          console.error("Failed to initialize data SDK");
        }
      }
    }

    function updateGarageUI() {
      if (!gameData) return;

      document.getElementById('coin-count').textContent = gameData.coins || 0;
      document.getElementById('diamond-count').textContent = gameData.diamonds || 0;

      const upgrades = {
        engine: { level: gameData.engine_level || 1, progress: 'engine-progress', label: 'engine-level', button: 'engine-upgrade' },
        suspension: { level: gameData.suspension_level || 1, progress: 'suspension-progress', label: 'suspension-level', button: 'suspension-upgrade' },
        tires: { level: gameData.tires_level || 1, progress: 'tires-progress', label: 'tires-level', button: 'tires-upgrade' },
        four_wd: { level: gameData.four_wd_level || 1, progress: 'four-wd-progress', label: 'four-wd-level', button: 'four-wd-upgrade' }
      };

      for (const [key, data] of Object.entries(upgrades)) {
        const level = data.level;
        const cost = level * 100;
        
        document.getElementById(data.label).textContent = `Level ${level}`;
        document.getElementById(data.progress).style.width = `${Math.min(level * 10, 100)}%`;
        
        const button = document.getElementById(data.button);
        button.textContent = `Upgrade (${cost} 🪙)`;
        button.disabled = (gameData.coins || 0) < cost || level >= 10;
      }
    }

    async function handleUpgrade(upgradeType) {
      if (!gameData) return;

      const levelKey = `${upgradeType}_level`;
      const currentLevel = gameData[levelKey] || 1;
      const cost = currentLevel * 100;

      if ((gameData.coins || 0) < cost || currentLevel >= 10) {
        return;
      }

      const button = document.querySelector(`[data-upgrade="${upgradeType}"]`);
      button.disabled = true;
      button.textContent = 'Upgrading...';

      gameData.coins -= cost;
      gameData[levelKey] = currentLevel + 1;

      const result = await window.dataSdk.update(gameData);
      
      if (!result.isOk) {
        gameData.coins += cost;
        gameData[levelKey] = currentLevel;
        button.disabled = false;
        
        const errorMsg = document.createElement('div');
        errorMsg.textContent = 'Upgrade failed. Please try again.';
        errorMsg.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff0000;color:white;padding:20px;border-radius:10px;z-index:9999;';
        document.body.appendChild(errorMsg);
        setTimeout(() => errorMsg.remove(), 2000);
      }
    }

    document.querySelectorAll('.upgrade-button').forEach(button => {
      button.addEventListener('click', (e) => {
        const upgradeType = e.target.dataset.upgrade;
        handleUpgrade(upgradeType);
      });
    });

    document.getElementById('race-button').addEventListener('click', () => {
      document.getElementById('garage-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('active');
      startGame();
    });

    document.getElementById('back-button').addEventListener('click', async () => {
      document.getElementById('game-over-screen').classList.remove('visible');
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('garage-screen').classList.remove('hidden');
      updateGarageUI();
    });

    // Game Engine
    let canvas, ctx, gameLoop, gameActive;
    let vehicle, terrain, camera, fuel, distance, coinsCollected;
    let driverImage = new Image();
    driverImage.src = 'player.jpg';

    function startGame() {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      gameActive = true;
      fuel = 100;
      distance = 0;
      coinsCollected = 0;

      const engineLevel = (gameData?.engine_level || 1);
      const suspensionLevel = (gameData?.suspension_level || 1);
      const tiresLevel = (gameData?.tires_level || 1);
      const fourWdLevel = (gameData?.four_wd_level || 1);

      vehicle = {
        x: 200,
        y: 300,
        vx: 0,
        vy: 0,
        rotation: 0,
        angularVelocity: 0,
        wheelRadius: 30 + tiresLevel * 2,
        wheelBase: 140,
        power: 0.4 + engineLevel * 0.06,
        suspensionK: 0.08 + suspensionLevel * 0.01,
        suspensionDamping: 0.7 + suspensionLevel * 0.02,
        grip: 0.92 + tiresLevel * 0.008,
        fourWd: fourWdLevel > 5,
        mass: 100,
        frontWheelVy: 0,
        rearWheelVy: 0
      };

      terrain = generateTerrain();
      camera = { x: 0 };

      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('keyup', handleKeyUp);

      gameLoop = setInterval(updateGame, 1000 / 60);
    }

    const keys = { left: false, right: false };

    function handleKeyDown(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    }

    function handleKeyUp(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    }

    function generateTerrain() {
      const points = [];
      for (let x = 0; x < 10000; x += 50) {
        const y = 400 + Math.sin(x * 0.01) * 80 + Math.sin(x * 0.03) * 40 + Math.cos(x * 0.005) * 60;
        points.push({ x, y });
      }
      return points;
    }

    function getTerrainY(x) {
      for (let i = 0; i < terrain.length - 1; i++) {
        if (x >= terrain[i].x && x < terrain[i + 1].x) {
          const t = (x - terrain[i].x) / (terrain[i + 1].x - terrain[i].x);
          return terrain[i].y + (terrain[i + 1].y - terrain[i].y) * t;
        }
      }
      return terrain[terrain.length - 1].y;
    }

    function updateGame() {
      if (!gameActive) return;

      // Physics with proper damping
      const gravity = 0.4;
      vehicle.vy += gravity;

      if (keys.right && fuel > 0) {
        vehicle.vx += vehicle.power;
        fuel -= 0.08;
      }
      if (keys.left && fuel > 0) {
        vehicle.vx -= vehicle.power * 0.6;
        fuel -= 0.04;
      }

      // Air resistance
      vehicle.vx *= 0.985;
      
      // Wheel collision with damping
      const frontWheelX = vehicle.x + Math.cos(vehicle.rotation) * vehicle.wheelBase / 2;
      const frontWheelY = vehicle.y + Math.sin(vehicle.rotation) * vehicle.wheelBase / 2;
      const rearWheelX = vehicle.x - Math.cos(vehicle.rotation) * vehicle.wheelBase / 2;
      const rearWheelY = vehicle.y - Math.sin(vehicle.rotation) * vehicle.wheelBase / 2;

      const frontTerrainY = getTerrainY(frontWheelX);
      const rearTerrainY = getTerrainY(rearWheelX);

      // Front wheel suspension with damping
      if (frontWheelY + vehicle.wheelRadius > frontTerrainY) {
        const compression = (frontWheelY + vehicle.wheelRadius) - frontTerrainY;
        const springForce = -compression * vehicle.suspensionK;
        const dampingForce = -vehicle.frontWheelVy * vehicle.suspensionDamping;
        const totalForce = springForce + dampingForce;
        
        vehicle.vy += totalForce;
        vehicle.angularVelocity -= compression * 0.0008;
        vehicle.frontWheelVy = vehicle.vy;
        
        // Ground friction
        if (Math.abs(vehicle.vx) > 0.1) {
          vehicle.vx *= vehicle.grip;
        }
      } else {
        vehicle.frontWheelVy = 0;
      }

      // Rear wheel suspension with damping
      if (rearWheelY + vehicle.wheelRadius > rearTerrainY) {
        const compression = (rearWheelY + vehicle.wheelRadius) - rearTerrainY;
        const springForce = -compression * vehicle.suspensionK;
        const dampingForce = -vehicle.rearWheelVy * vehicle.suspensionDamping;
        const totalForce = springForce + dampingForce;
        
        vehicle.vy += totalForce;
        vehicle.angularVelocity += compression * 0.0008;
        vehicle.rearWheelVy = vehicle.vy;
        
        // Ground friction
        if (Math.abs(vehicle.vx) > 0.1) {
          vehicle.vx *= vehicle.grip;
        }
      } else {
        vehicle.rearWheelVy = 0;
      }

      vehicle.x += vehicle.vx;
      vehicle.y += vehicle.vy;
      vehicle.rotation += vehicle.angularVelocity;
      vehicle.angularVelocity *= 0.92;

      // Check game over conditions
      const touchingGround = (frontWheelY + vehicle.wheelRadius >= frontTerrainY - 5) || 
                             (rearWheelY + vehicle.wheelRadius >= rearTerrainY - 5);
      const rotationDeg = (vehicle.rotation * 180 / Math.PI) % 360;
      const normalizedRotation = ((rotationDeg + 360) % 360);
      
      if (touchingGround && (normalizedRotation > 120 && normalizedRotation < 240)) {
        endGame('crash');
        return;
      }

      if (fuel <= 0) {
        endGame('fuel');
        return;
      }

      // Update stats
      distance = Math.floor(vehicle.x / 10);
      if (Math.random() < 0.02) {
        coinsCollected++;
      }

      document.getElementById('distance-stat').textContent = distance;
      document.getElementById('coins-stat').textContent = coinsCollected;
      document.getElementById('fuel-fill').style.width = `${Math.max(0, fuel)}%`;

      camera.x = vehicle.x - canvas.width / 3;

      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ultra Premium Sky Background
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGradient.addColorStop(0, '#001f3f');
      skyGradient.addColorStop(0.2, '#1a4d7a');
      skyGradient.addColorStop(0.4, '#3a7ca5');
      skyGradient.addColorStop(0.7, '#87CEEB');
      skyGradient.addColorStop(1, '#B8E6FF');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Atmospheric haze layers
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(0, i * 100, canvas.width, 80);
      }

      // Epic sun with rays
      const sunX = canvas.width - 200;
      const sunY = 120;
      
      // Sun rays
      ctx.strokeStyle = 'rgba(255, 245, 200, 0.3)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 16; i++) {
        const angle = (i * Math.PI * 2) / 16;
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        ctx.lineTo(
          sunX + Math.cos(angle) * 180,
          sunY + Math.sin(angle) * 180
        );
        ctx.stroke();
      }
      
      // Sun glow layers
      for (let i = 5; i > 0; i--) {
        const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 40 + i * 20);
        sunGradient.addColorStop(0, `rgba(255, 255, 230, ${0.8 / i})`);
        sunGradient.addColorStop(0.5, `rgba(255, 230, 100, ${0.3 / i})`);
        sunGradient.addColorStop(1, 'rgba(255, 224, 102, 0)');
        ctx.fillStyle = sunGradient;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 40 + i * 20, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Sun core
      const coreGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 50);
      coreGradient.addColorStop(0, '#FFFFFF');
      coreGradient.addColorStop(0.3, '#FFF9E6');
      coreGradient.addColorStop(0.7, '#FFE066');
      coreGradient.addColorStop(1, '#FFD700');
      ctx.fillStyle = coreGradient;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
      ctx.fill();

      // Premium volumetric clouds
      for (let i = 0; i < 8; i++) {
        const x = ((i * 350 - camera.x * 0.15) % (canvas.width + 300)) - 150;
        const y = 50 + i * 30;
        const scale = 0.8 + (i % 3) * 0.15;
        
        // Cloud shadow
        ctx.fillStyle = 'rgba(100, 100, 120, 0.15)';
        ctx.beginPath();
        ctx.ellipse(x + 40, y + 60, 80 * scale, 25 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Main cloud body with depth
        const cloudLayers = [
          { alpha: 0.95, offset: 0, sizes: [40, 55, 50, 45, 40] },
          { alpha: 0.85, offset: 5, sizes: [38, 50, 48, 42, 38] },
          { alpha: 0.7, offset: 10, sizes: [35, 48, 45, 40, 35] }
        ];
        
        cloudLayers.forEach(layer => {
          ctx.fillStyle = `rgba(255, 255, 255, ${layer.alpha})`;
          ctx.beginPath();
          ctx.arc(x, y + layer.offset, layer.sizes[0] * scale, 0, Math.PI * 2);
          ctx.arc(x + 30, y + layer.offset, layer.sizes[1] * scale, 0, Math.PI * 2);
          ctx.arc(x + 65, y + layer.offset, layer.sizes[2] * scale, 0, Math.PI * 2);
          ctx.arc(x + 95, y + layer.offset, layer.sizes[3] * scale, 0, Math.PI * 2);
          ctx.arc(x + 125, y + layer.offset, layer.sizes[4] * scale, 0, Math.PI * 2);
          ctx.fill();
        });
        
        // Cloud highlights
        ctx.fillStyle = `rgba(255, 255, 255, 0.6)`;
        ctx.beginPath();
        ctx.arc(x + 20, y - 5, 25 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50, y - 8, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mountains in distance
      ctx.fillStyle = 'rgba(80, 100, 120, 0.4)';
      for (let i = 0; i < 6; i++) {
        const mountainX = ((i * 600 - camera.x * 0.1) % (canvas.width + 400)) - 200;
        ctx.beginPath();
        ctx.moveTo(mountainX, canvas.height * 0.6);
        ctx.lineTo(mountainX + 150, canvas.height * 0.3);
        ctx.lineTo(mountainX + 300, canvas.height * 0.6);
        ctx.closePath();
        ctx.fill();
      }

      // Premium terrain with realistic grass
      const terrainGradient = ctx.createLinearGradient(0, 350, 0, canvas.height);
      terrainGradient.addColorStop(0, '#5D8C3C');
      terrainGradient.addColorStop(0.2, '#4A7C2F');
      terrainGradient.addColorStop(0.5, '#3D6625');
      terrainGradient.addColorStop(0.8, '#2F501C');
      terrainGradient.addColorStop(1, '#1F3512');
      ctx.fillStyle = terrainGradient;
      ctx.strokeStyle = '#2E4A1A';
      ctx.lineWidth = 6;
      
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;
      
      ctx.beginPath();
      ctx.moveTo(-camera.x, canvas.height);
      
      for (const point of terrain) {
        ctx.lineTo(point.x - camera.x, point.y);
      }
      
      ctx.lineTo(terrain[terrain.length - 1].x - camera.x, canvas.height);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Terrain top edge with highlight
      ctx.strokeStyle = '#7CAA4A';
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < terrain.length; i++) {
        if (i === 0) {
          ctx.moveTo(terrain[i].x - camera.x, terrain[i].y);
        } else {
          ctx.lineTo(terrain[i].x - camera.x, terrain[i].y);
        }
      }
      ctx.stroke();
      
      // Darker base outline
      ctx.strokeStyle = '#1F3512';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      // Realistic grass blades with depth
      for (let i = 0; i < terrain.length; i += 2) {
        const x = terrain[i].x - camera.x;
        const y = terrain[i].y;
        
        // Grass cluster
        for (let j = 0; j < 5; j++) {
          const offsetX = (j - 2) * 8;
          const height = 10 + Math.random() * 12;
          const bend = (Math.random() - 0.5) * 4;
          
          // Grass shadow
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + offsetX + 1, y + 2);
          ctx.quadraticCurveTo(
            x + offsetX + bend + 1, 
            y - height / 2 + 2, 
            x + offsetX + bend + 1, 
            y - height + 2
          );
          ctx.stroke();
          
          // Grass blade
          const grassColors = ['#7CAA4A', '#689438', '#8BC34A', '#6A9F3E'];
          ctx.strokeStyle = grassColors[j % grassColors.length];
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + offsetX, y);
          ctx.quadraticCurveTo(
            x + offsetX + bend, 
            y - height / 2, 
            x + offsetX + bend, 
            y - height
          );
          ctx.stroke();
          
          // Grass highlight
          ctx.strokeStyle = 'rgba(200, 255, 150, 0.5)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + offsetX, y);
          ctx.lineTo(x + offsetX + bend * 0.3, y - height * 0.4);
          ctx.stroke();
        }
      }
      
      // Flowers and details
      for (let i = 0; i < terrain.length; i += 15) {
        const x = terrain[i].x - camera.x;
        const y = terrain[i].y;
        
        if (Math.random() > 0.5) {
          // Flower
          const flowerColors = ['#FFD700', '#FF6B9D', '#9C27B0', '#03A9F4'];
          const flowerColor = flowerColors[Math.floor(Math.random() * flowerColors.length)];
          
          // Stem
          ctx.strokeStyle = '#5D8C3C';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y - 15);
          ctx.stroke();
          
          // Petals
          ctx.fillStyle = flowerColor;
          for (let p = 0; p < 5; p++) {
            const angle = (p * Math.PI * 2) / 5;
            ctx.beginPath();
            ctx.arc(
              x + Math.cos(angle) * 4,
              y - 15 + Math.sin(angle) * 4,
              3,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
          
          // Center
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(x, y - 15, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Vehicle
      ctx.save();
      ctx.translate(vehicle.x - camera.x, vehicle.y);
      ctx.rotate(vehicle.rotation);

      // Premium Vehicle body with metallic gradient
      const bodyGradient = ctx.createLinearGradient(-70, -50, 70, 50);
      bodyGradient.addColorStop(0, '#FF3D00');
      bodyGradient.addColorStop(0.25, '#E53935');
      bodyGradient.addColorStop(0.5, '#FF1744');
      bodyGradient.addColorStop(0.75, '#C62828');
      bodyGradient.addColorStop(1, '#8B0000');
      ctx.fillStyle = bodyGradient;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 6;
      
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetX = 8;
      ctx.shadowOffsetY = 8;
      
      // Rounded body
      ctx.beginPath();
      ctx.moveTo(-55, -35);
      ctx.lineTo(55, -35);
      ctx.arcTo(65, -35, 65, -25, 10);
      ctx.lineTo(65, 15);
      ctx.arcTo(65, 25, 55, 25, 10);
      ctx.lineTo(-55, 25);
      ctx.arcTo(-65, 25, -65, 15, 10);
      ctx.lineTo(-65, -25);
      ctx.arcTo(-65, -35, -55, -35, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      
      // Body shine/highlight
      const shineGradient = ctx.createLinearGradient(-60, -40, 60, -20);
      shineGradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
      shineGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
      shineGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = shineGradient;
      ctx.fillRect(-60, -35, 120, 20);
      
      // Racing stripes
      ctx.fillStyle = '#FFD700';
      ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
      ctx.shadowBlur = 10;
      ctx.fillRect(-5, -35, 10, 60);
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeRect(-5, -35, 10, 60);

      // Premium Cabin/Cockpit - BIGGER for epic head
      const cabinGradient = ctx.createLinearGradient(-35, -110, 35, -35);
      cabinGradient.addColorStop(0, '#FF3D00');
      cabinGradient.addColorStop(0.3, '#E53935');
      cabinGradient.addColorStop(0.7, '#C62828');
      cabinGradient.addColorStop(1, '#B71C1C');
      ctx.fillStyle = cabinGradient;
      
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 15;
      ctx.shadowOffsetX = 5;
      ctx.shadowOffsetY = 5;
      
      // Rounded cabin - MASSIVE for 100px head
      ctx.beginPath();
      ctx.moveTo(-40, -35);
      ctx.lineTo(-40, -85);
      ctx.arcTo(-40, -110, -20, -110, 25);
      ctx.lineTo(20, -110);
      ctx.arcTo(40, -110, 40, -85, 25);
      ctx.lineTo(40, -35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Windshield with realistic reflection - BIGGER
      const windshieldGradient = ctx.createLinearGradient(-32, -100, 32, -40);
      windshieldGradient.addColorStop(0, 'rgba(135, 206, 250, 0.7)');
      windshieldGradient.addColorStop(0.5, 'rgba(100, 180, 255, 0.5)');
      windshieldGradient.addColorStop(1, 'rgba(70, 150, 230, 0.3)');
      ctx.fillStyle = windshieldGradient;
      
      ctx.beginPath();
      ctx.moveTo(-28, -42);
      ctx.lineTo(-28, -88);
      ctx.arcTo(-28, -102, -18, -102, 14);
      ctx.lineTo(18, -102);
      ctx.arcTo(28, -102, 28, -88, 14);
      ctx.lineTo(28, -42);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.stroke();
      
      // Windshield realistic reflection/glare
      const glareGradient = ctx.createLinearGradient(-26, -102, 26, -80);
      glareGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      glareGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
      glareGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glareGradient;
      ctx.fillRect(-26, -102, 52, 22);

      // Driver head with your photo - ABSOLUTELY MASSIVE EPIC HEAD
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -65, 55, 0, Math.PI * 2); // HUGE 55px radius
      ctx.closePath();
      ctx.clip();
      
      // Draw image EPIC SIZE
      if (driverImage.complete && driverImage.naturalHeight !== 0) {
        ctx.drawImage(driverImage, -55, -120, 110, 110); // EPIC 110x110 head!
      } else {
        // Fallback if image doesn't load
        ctx.fillStyle = '#FFD700';
        ctx.fill();
      }
      ctx.restore();

      // MASSIVE golden helmet outline with epic glow
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 7;
      ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(0, -65, 55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      
      // Epic helmet visor reflection
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, -65, 50, Math.PI * 1.2, Math.PI * 1.8);
      ctx.stroke();

      // Headlights
      const headlightGradient = ctx.createRadialGradient(50, -10, 0, 50, -10, 10);
      headlightGradient.addColorStop(0, '#FFFF99');
      headlightGradient.addColorStop(0.5, '#FFFF66');
      headlightGradient.addColorStop(1, '#FFD700');
      ctx.fillStyle = headlightGradient;
      ctx.shadowColor = 'rgba(255, 255, 100, 0.8)';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(50, -10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      // Tail light
      const tailGradient = ctx.createRadialGradient(-58, 0, 0, -58, 0, 7);
      tailGradient.addColorStop(0, '#FF6666');
      tailGradient.addColorStop(0.5, '#FF0000');
      tailGradient.addColorStop(1, '#CC0000');
      ctx.fillStyle = tailGradient;
      ctx.beginPath();
      ctx.arc(-58, 0, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      
      // Exhaust pipe with metallic look
      const exhaustGradient = ctx.createLinearGradient(-60, 18, -60, 24);
      exhaustGradient.addColorStop(0, '#555');
      exhaustGradient.addColorStop(0.5, '#333');
      exhaustGradient.addColorStop(1, '#222');
      ctx.fillStyle = exhaustGradient;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.fillRect(-63, 18, 18, 7);
      ctx.strokeRect(-63, 18, 18, 7);
      
      // Exhaust opening
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-63, 21, 3, 0, Math.PI * 2);
      ctx.fill();

      // Door lines
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(10, -35);
      ctx.lineTo(10, 25);
      ctx.stroke();

      // Wheels with ultra-realistic details
      const drawWheel = (x, y) => {
        // Tire with 3D effect
        const tireGradient = ctx.createRadialGradient(x, y, 0, x, y, vehicle.wheelRadius);
        tireGradient.addColorStop(0, '#3a3a3a');
        tireGradient.addColorStop(0.6, '#1a1a1a');
        tireGradient.addColorStop(0.9, '#0a0a0a');
        tireGradient.addColorStop(1, '#000000');
        ctx.fillStyle = tireGradient;
        
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetX = 5;
        ctx.shadowOffsetY = 5;
        
        ctx.beginPath();
        ctx.arc(x, y, vehicle.wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Tire outline
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.stroke();
        
        // Rim/Hub with chrome effect
        const rimGradient = ctx.createRadialGradient(x, y, 0, x, y, vehicle.wheelRadius * 0.65);
        rimGradient.addColorStop(0, '#E0E0E0');
        rimGradient.addColorStop(0.3, '#C0C0C0');
        rimGradient.addColorStop(0.6, '#909090');
        rimGradient.addColorStop(1, '#505050');
        ctx.fillStyle = rimGradient;
        
        ctx.beginPath();
        ctx.arc(x, y, vehicle.wheelRadius * 0.65, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#303030';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // Spokes with metallic shine
        ctx.strokeStyle = '#A0A0A0';
        ctx.lineWidth = 4;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI * 2) / 6;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(
            x + Math.cos(angle) * vehicle.wheelRadius * 0.6,
            y + Math.sin(angle) * vehicle.wheelRadius * 0.6
          );
          ctx.stroke();
        }
        
        // Center cap with gold accent
        const capGradient = ctx.createRadialGradient(x, y, 0, x, y, vehicle.wheelRadius * 0.25);
        capGradient.addColorStop(0, '#FFD700');
        capGradient.addColorStop(0.7, '#FFA500');
        capGradient.addColorStop(1, '#B8860B');
        ctx.fillStyle = capGradient;
        ctx.beginPath();
        ctx.arc(x, y, vehicle.wheelRadius * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Tire tread pattern
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI * 2) / 12;
          const innerRadius = vehicle.wheelRadius * 0.7;
          const outerRadius = vehicle.wheelRadius * 0.95;
          ctx.beginPath();
          ctx.moveTo(
            x + Math.cos(angle) * innerRadius,
            y + Math.sin(angle) * innerRadius
          );
          ctx.lineTo(
            x + Math.cos(angle) * outerRadius,
            y + Math.sin(angle) * outerRadius
          );
          ctx.stroke();
        }
      };
      
      drawWheel(-vehicle.wheelBase / 2, 20);
      drawWheel(vehicle.wheelBase / 2, 20);

      ctx.restore();
    }

    async function endGame(reason) {
      gameActive = false;
      clearInterval(gameLoop);
      document.removeEventListener('keydown', handleKeyDown);
      document.removeEventListener('keyup', handleKeyUp);

      document.getElementById('final-distance').textContent = `${distance}m`;
      document.getElementById('final-coins').textContent = coinsCollected;

      if (!gameData) {
        const createResult = await window.dataSdk.create({
          coins: coinsCollected,
          diamonds: 0,
          engine_level: 1,
          suspension_level: 1,
          tires_level: 1,
          four_wd_level: 1,
          high_score: distance
        });
        
        if (createResult.isOk) {
          // Data will come through onDataChanged
        }
      } else {
        gameData.coins = (gameData.coins || 0) + coinsCollected;
        gameData.high_score = Math.max(gameData.high_score || 0, distance);
        await window.dataSdk.update(gameData);
      }

      document.getElementById('high-score').textContent = `${gameData?.high_score || distance}m`;
      document.getElementById('game-over-screen').classList.add('visible');
    }

    window.addEventListener('load', initGame);
    window.addEventListener('resize', () => {
      if (canvas) {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
    });
  </script>
